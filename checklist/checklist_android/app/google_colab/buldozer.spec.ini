[app]

# --- Название и пакет ---
title = Чек-лист операций
package.name = checklist
package.domain = org.example

# --- Источник ---
source.dir = .
source.include_exts = py,kv,json,png,jpg,atlas
source.exclude_dirs = bin,.buildozer,__pycache__
source.exclude_patterns = *.pyc,*.pyo,*.db,*.log
version = 1.0

# --- Зависимости ---
requirements = python3,kivy==2.3.0

# --- Ориентация ---
orientation = portrait
fullscreen = 0

# --- Иконка и заставка (опционально) ---
# icon.filename = %(source.dir)s/data/icon.png
# presplash.filename = %(source.dir)s/data/presplash.png

# --- Разрешения Android ---
android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE

# --- API ---
android.api = 33
android.minapi = 21
android.ndk_api = 21
android.archs = arm64-v8a,armeabi-v7a

# --- Метаданные магазина ---
android.meta_data =
android.release_artifact = apk
android.debug_artifact = apk

# --- Логи ---
android.logcat_filters = *:S python:D

# --- Прочее ---
android.allow_backup = True
android.accept_sdk_license = True

[buildozer]
log_level = 2
warn_on_root = 1